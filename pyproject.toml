[project]
name = "rfsrealloc"
version = "1.0.0"
description = "Exact reconstruction of Renewable Fuel Standard percentage standards, propagation of small-refinery-exemption uncertainty, and evaluation of reallocation timing rules"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Avin Gupta", email = "iamavingupta@gmail.com" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "pint>=0.24",
    "SALib>=1.5",
    "pyarrow>=17.0",
    "xlrd>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.110",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "requests>=2.32",
    "types-requests>=2.32",
]

[project.scripts]
rfsrealloc = "rfsrealloc.pipeline:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfsrealloc"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts", "figures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*", "SALib.*", "matplotlib.*", "xlrd.*", "pint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
